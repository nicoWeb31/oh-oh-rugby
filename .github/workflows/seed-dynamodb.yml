name: Seed DynamoDB

on:
  workflow_dispatch:
    inputs:
      environment:
        # `prod` is intentionally not a choice: the seed script overwrites
        # (PutItem, not merge) every item at each key, and prod now holds
        # real player predictions. Re-seeding it would silently destroy
        # them. If prod ever genuinely needs a full data reset, do it as a
        # deliberate one-off (edit this file to add `prod` back, run it,
        # revert), never as a routine option sitting in the dropdown.
        description: 'Target environment (prod excluded on purpose — see comment above)'
        required: true
        type: choice
        options: [dev]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Seed demo data
        env:
          DYNAMODB_TABLE: oh-rugby-${{ inputs.environment }}
          AWS_REGION: eu-west-3
        run: npm run seed:dynamodb
